<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Chapai Haat · Parcel Verification</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f0f4f8; margin: 0; padding: 16px; font-family: 'Inter', sans-serif; }
    .verification-container { max-width: 600px; margin: 0 auto; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
    .header { border-bottom: 2px solid #1C6B20; padding-bottom: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .header .logo { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: white; padding: 2px; }
    .header h1 { font-size: 20px; margin: 0; color: #0b2d4b; }
    .header .sub { font-size: 12px; color: #999; }
    .field { margin-bottom: 12px; }
    .field .label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    .field .value { font-size: 16px; font-weight: 600; color: #1a2332; }
    .field .value.large { font-size: 24px; color: #1C6B20; }
    .badge-free { display: inline-block; background: #d1fae5; color: #065f46; padding: 2px 12px; border-radius: 12px; font-weight: 600; font-size: 12px; }
    .status-badge { display: inline-block; padding: 2px 12px; border-radius: 12px; font-weight: 600; font-size: 12px; text-transform: capitalize; }
    .status-badge.pending { background: #fef3c7; color: #92400e; }
    .status-badge.delivered { background: #d1fae5; color: #065f46; }
    .status-badge.cancelled { background: #fee2e2; color: #991b1b; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .footer { margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee; text-align: center; font-size: 11px; color: #999; }
    .loading { text-align: center; padding: 40px; }
    .loading .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1C6B20; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } .card { padding: 16px; } }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b2d4b">
</head>
<body>
  <div class="verification-container" id="verificationContainer">
    <div class="loading">
      <div class="spinner"></div>
      <p style="color:#666;margin-top:12px;">Loading parcel details...</p>
    </div>
  </div>

  <script>
    // Get parcel ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const parcelId = urlParams.get('id');
    
    // Import DB
    const script = document.createElement('script');
    script.src = 'js/db.js';
    script.onload = async function() {
      try {
        await db.init();
        const orders = await db.getAll('orders');
        const order = orders.find(o => o.parcelId === parcelId);
        
        const container = document.getElementById('verificationContainer');
        
        if (!order) {
          container.innerHTML = `
            <div class="card" style="text-align:center;padding:40px;">
              <div style="font-size:48px;margin-bottom:16px;">📦</div>
              <h2 style="color:#e74c3c;">Parcel Not Found</h2>
              <p style="color:#666;">No parcel found with ID: <strong>${parcelId}</strong></p>
              <p style="color:#999;font-size:14px;margin-top:12px;">Please check the QR code or contact support.</p>
            </div>
          `;
          return;
        }
        
        const isFreeShipping = order.freeShipping || order.deliveryCharge === 0;
        
        container.innerHTML = `
          <div class="card">
            <div class="header">
              <img src="assets/logo.svg" alt="Chapai Haat" class="logo" onerror="this.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(window.CHAPAI_LOGO_SVG || '')">
              <div>
                <h1>📦 Parcel Details</h1>
                <div class="sub">Chapai Haat · Parcel Verification</div>
              </div>
            </div>
            
            <div style="background:#f8fafc;padding:12px 16px;border-radius:8px;border-left:4px solid #1C6B20;margin-bottom:16px;">
              <div style="font-size:11px;color:#999;">PARCEL ID</div>
              <div style="font-size:28px;font-weight:700;color:#1C6B20;">${order.parcelId}</div>
            </div>
            
            <div class="grid-2">
              <div class="field">
                <div class="label">Customer Name</div>
                <div class="value">${order.customerName}</div>
              </div>
              <div class="field">
                <div class="label">Mobile Number</div>
                <div class="value">${order.mobile}</div>
              </div>
              <div class="field" style="grid-column:span 2;">
                <div class="label">Address</div>
                <div class="value">${order.address}</div>
              </div>
              ${order.district ? `<div class="field"><div class="label">District</div><div class="value">${order.district}</div></div>` : ''}
              ${order.area ? `<div class="field"><div class="label">Area</div><div class="value">${order.area}</div></div>` : ''}
              <div class="field">
                <div class="label">Product</div>
                <div class="value">${order.productName || '-'}</div>
              </div>
              <div class="field">
                <div class="label">Quantity</div>
                <div class="value">${order.quantity || 1}</div>
              </div>
              <div class="field">
                <div class="label">COD Amount</div>
                <div class="value large">৳${order.codAmount.toFixed(2)}</div>
              </div>
              <div class="field">
                <div class="label">Delivery Charge</div>
                <div class="value">${isFreeShipping ? '<span class="badge-free">FREE SHIPPING</span>' : '৳' + (order.deliveryCharge || 0).toFixed(2)}</div>
              </div>
              <div class="field">
                <div class="label">Status</div>
                <div><span class="status-badge ${order.status}">${order.status}</span></div>
              </div>
              <div class="field">
                <div class="label">Date & Time</div>
                <div class="value" style="font-size:14px;">${new Date(order.createdAt).toLocaleString()}</div>
              </div>
            </div>
            
            ${order.note ? `
              <div style="margin-top:12px;padding:12px;background:#f8fafc;border-radius:8px;border:1px dashed #ddd;">
                <div style="font-size:11px;color:#999;">Note</div>
                <div style="font-size:14px;color:#555;">${order.note}</div>
              </div>
            ` : ''}
            
            <div class="footer">
              Chapai Haat · ${new Date().toLocaleDateString()} · <span style="color:#1C6B20;">${order.parcelId}</span>
            </div>
          </div>
        `;
      } catch (error) {
        document.getElementById('verificationContainer').innerHTML = `
          <div class="card" style="text-align:center;padding:40px;">
            <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
            <h2 style="color:#e74c3c;">Error Loading Parcel</h2>
            <p style="color:#666;">${error.message}</p>
          </div>
        `;
      }
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
